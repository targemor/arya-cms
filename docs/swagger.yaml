            $ref: '#/definitions/v1.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Error'
      security:
      - BearerAuth: []
      summary: Update single entry
      tags:
      - content
  /internal/components:
    get:
      description: List every component defined
      operationId: list-components
      produces:
